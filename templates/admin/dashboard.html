<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Pothole GO</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f3f4f6; }
        
        header { background: #1f2937; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h2 { margin: 0; font-size: 20px; }
        header nav { display: flex; align-items: center; }
        header nav a { color: #9ca3af; text-decoration: none; margin-left: 15px; font-size: 14px; }
        header nav a.active { color: #ffffff; font-weight: bold; }
        
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .stat-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { margin: 0; color: #6b7280; font-size: 16px; text-transform: uppercase; }
        .stat-card .number { font-size: 48px; font-weight: bold; margin: 10px 0 0 0; color: #1f2937; }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; }
            header nav { margin-top: 15px; flex-wrap: wrap; gap: 10px; }
            header nav a { margin-left: 0; background: #374151; padding: 8px 12px; border-radius: 4px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>
    <header>
        <h2>📊 System Dashboard</h2>
        <nav>
            <a href="/admin/dashboard" class="active">Dashboard</a>
            <a href="/admin/map">Map</a>
            <a href="/admin/potholes">List</a>
            <a href="/admin/reports">Reports</a>
            <a href="/admin/dashcam">Camera</a>
        </nav>
    </header>
    
    <div class="container">
        <h1 style="color:#1f2937; margin-top:0;">System Overview</h1>
        <div class="stats-grid">
            <div class="stat-card" style="border-top: 5px solid #ef4444;">
                <h3>Active Hazards (Pending)</h3>
                <p class="number" id="stat-pending">0</p>
            </div>
            <div class="stat-card" style="border-top: 5px solid #f59e0b;">
                <h3>Needs Review</h3>
                <p class="number" id="stat-review">0</p>
            </div>
            <div class="stat-card" style="border-top: 5px solid #22c55e;">
                <h3>Total Fixed</h3>
                <p class="number" id="stat-fixed">0</p>
            </div>
        </div>
    </div>

    <script>
        function loadStats() {
            fetch('/api/potholes').then(res => res.json()).then(data => {
                let pending = 0, review = 0, fixed = 0;
                data.forEach(p => {
                    if (p.status === 'pending') pending++;
                    if (p.status === 'review') review++;
                    if (p.status === 'fixed') fixed++;
                });
                document.getElementById('stat-pending').innerText = pending;
                document.getElementById('stat-review').innerText = review;
                document.getElementById('stat-fixed').innerText = fixed;
            });
        }
        loadStats();
    </script>
</body>
</html>
