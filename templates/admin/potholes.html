<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Hazards - Pothole GO</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f3f4f6; }
        
        /* Mobile-Friendly Header */
        header { background: #1f2937; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h2 { margin: 0; font-size: 20px; }
        header nav { display: flex; align-items: center; }
        header nav a { color: #9ca3af; text-decoration: none; margin-left: 15px; font-size: 14px; }
        header nav a.active { color: #ffffff; font-weight: bold; }
        
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Responsive Table Wrapper */
        .table-wrapper { width: 100%; overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; min-width: 650px; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        th { background: #f9fafb; font-weight: bold; color: #4b5563; }
        
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-report { background: #f59e0b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; font-weight: bold;}
        .btn-save { background: #3b82f6; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 5px;}
        
        .thumbnail { max-height: 50px; border-radius: 4px; border: 1px solid #ccc; background: white;}
        .photo-input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 120px; font-size: 12px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999; padding: 10px;}
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .btn-send, .btn-close { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; color: white; font-size: 16px;}
        .btn-send { background: #ea580c; }
        .btn-close { background: #9ca3af; margin-bottom: 0;}

        /* Mobile CSS Overrides */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; }
            header nav { margin-top: 15px; flex-wrap: wrap; gap: 10px; }
            header nav a { margin-left: 0; background: #374151; padding: 8px 12px; border-radius: 4px; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <h2>📋 Hazard Database</h2>
        <nav>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/map">Map</a>
            <a href="/admin/potholes" class="active">List</a>
            <a href="/admin/reports">Reports</a>
            <a href="/admin/dashcam">Camera</a>
        </nav>
    </header>
    
    <div class="container">
        <!-- New Swipeable Wrapper -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Coordinates</th>
                        <th>Status</th>
                        <th>Evidence</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">📝 File Official Complaint</h3>
            <div class="form-group"><label>Hazard Coordinates:</label><input type="text" id="report-coords" readonly style="background:#f3f4f6;"></div>
            <div class="form-group"><label>Inspector Notes:</label><textarea id="report-notes" rows="4"></textarea></div>
            <input type="hidden" id="report-id">
            <button class="btn-send" onclick="submitReport()">📨 Send Report</button>
            <button class="btn-close" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        function loadData() {
            fetch('/api/potholes')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';
                    
                    data.forEach(p => {
                        let statusColor = p.status === 'pending' ? '#fee2e2' : (p.status === 'review' ? '#fef08a' : '#dcfce3');
                        let textColor = p.status === 'pending' ? '#ef4444' : (p.status === 'review' ? '#a16207' : '#22c55e');
                        
                        let origPhoto = p.image_url ? `<img src="${p.image_url}" class="thumbnail">` : `<input type="text" id="img-input-${p.id}" class="photo-input" placeholder="Paste URL"><button class="btn-save" onclick="saveImage(${p.id})">Save</button>`;
                        let proofPhoto = p.fixed_image_url ? `<img src="${p.fixed_image_url}" class="thumbnail" style="border:2px solid #3b82f6;">` : `None`;

                        let actions = ``;
                        if (p.status === 'review') {
                            actions = `<div style="display:flex; gap:5px;"><button style="background:#22c55e; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;" onclick="changeStatus(${p.id}, 'fixed')">✅ Approve</button><button style="background:#ef4444; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;" onclick="changeStatus(${p.id}, 'pending')">❌ Reject</button></div>`;
                        } else {
                            actions = `<div style="display:flex; gap:5px;"><button class="btn-report" onclick="openReportModal(${p.id}, ${p.latitude}, ${p.longitude})">📄 Report</button><button class="btn-delete" onclick="deleteP(${p.id})">Delete</button></div>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td><b>#${p.id}</b></td>
                                <td>${p.latitude.toFixed(4)}<br>${p.longitude.toFixed(4)}</td>
                                <td><span style="background:${statusColor}; color:${textColor}; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:12px;">${p.status.toUpperCase()}</span></td>
                                <td><div style="font-size:12px;"><b>Orig:</b> ${origPhoto}</div><div style="font-size:12px; margin-top:5px;"><b>Proof:</b> ${proofPhoto}</div></td>
                                <td>${actions}</td>
                            </tr>
                        `;
                    });
                });
        }
        function saveImage(id) { const url = document.getElementById(`img-input-${id}`).value; if(!url) return; fetch(`/api/potholes/${id}/image`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image_url: url }) }).then(() => loadData()); }
        function changeStatus(id, newStatus) { fetch(`/api/potholes/${id}/status`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) }).then(() => loadData()); }
        function openReportModal(id, lat, lng) { document.getElementById('report-id').value = id; document.getElementById('report-coords').value = lat.toFixed(4) + ', ' + lng.toFixed(4); document.getElementById('report-notes').value = ''; document.getElementById('reportModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('reportModal').style.display = 'none'; }
        function submitReport() { const id = document.getElementById('report-id').value; fetch(`/api/potholes/${id}/report`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ coordinates: document.getElementById('report-coords').value, notes: document.getElementById('report-notes').value }) }).then(() => { alert("✅ Official Report Sent!"); closeModal(); }); }
        function deleteP(id) { fetch(`/api/potholes/${id}`, {method: 'DELETE'}).then(() => loadData()); }
        loadData();
    </script>
</body>
</html>
